name: Software M5 Runtime Smoke

on:
  workflow_dispatch:
    inputs:
      confirm_paid_runtime:
        description: Confirm one paid external Codex runtime smoke call
        required: true
        type: boolean
        default: false
      codex_cli_version:
        description: Exact @openai/codex npm version to install
        required: true
        type: string
        default: '0.154.0'
      model:
        description: Model required by the Software M5 runtime evidence contract
        required: true
        type: string
        default: 'gpt-5.5'
      root_integration_run_id:
        description: Successful fresh-main Root run that integrated the current ADK source
        required: true
        type: string
        default: '34707461578'

permissions:
  contents: read

concurrency:
  group: software-m5-runtime-smoke
  cancel-in-progress: false

jobs:
  measured-runtime:
    name: measured-runtime
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - name: Require explicit paid-runtime confirmation
        shell: bash
        env:
          CONFIRM_PAID_RUNTIME: ${{ inputs.confirm_paid_runtime }}
        run: |
          set -euo pipefail
          [[ "$CONFIRM_PAID_RUNTIME" == "true" ]] || {
            echo '[FAIL] confirm_paid_runtime=true is required' >&2
            exit 2
          }

      - name: Checkout exact Root source
        uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd # v5
        with:
          persist-credentials: false
          fetch-depth: 0
          submodules: false

      - name: Materialize pinned agent-dev-kit gitlink
        shell: bash
        run: |
          set -euo pipefail
          git -c protocol.version=2 submodule update --init --depth 1 agent-dev-kit
          bash scripts/check-adk-lock.sh . --pin-only

      - name: Set up Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '22'

      - name: Install exact Codex CLI
        shell: bash
        env:
          CODEX_CLI_VERSION: ${{ inputs.codex_cli_version }}
        run: |
          set -euo pipefail
          [[ "$CODEX_CLI_VERSION" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]] || {
            echo '[FAIL] codex_cli_version must be an exact numeric version' >&2
            exit 2
          }
          npm install -g "@openai/codex@${CODEX_CLI_VERSION}"
          codex --version

      - name: Require hosted Codex authentication
        shell: bash
        env:
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
        run: |
          set -euo pipefail
          [[ -n "${OPENAI_API_KEY:-}" ]] || {
            echo '[FAIL] repository secret OPENAI_API_KEY is not configured; no model call was made' >&2
            exit 3
          }
          echo '[PASS] OPENAI_API_KEY is configured (value not printed)'

      - name: Execute one measured ADK runtime smoke
        shell: bash
        env:
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          MODEL: ${{ inputs.model }}
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/software-m5-runtime-smoke"
          python3 -m tools.codex_assets.runtime_smoke_evidence \
            --root . \
            --execute \
            --model "$MODEL" \
            --limit 1 \
            --raw-output "$RUNNER_TEMP/software-m5-runtime-smoke/raw-result.json" \
            --output "$RUNNER_TEMP/software-m5-runtime-smoke/runtime-smoke-evidence.json" \
            --summary-json \
            | tee "$RUNNER_TEMP/software-m5-runtime-smoke/collector-summary.json"

      - name: Build transactional 5.1 qualification candidate
        shell: bash
        env:
          ROOT_INTEGRATION_RUN_ID: ${{ inputs.root_integration_run_id }}
        run: |
          set -euo pipefail
          [[ "$ROOT_INTEGRATION_RUN_ID" =~ ^[1-9][0-9]*$ ]] || {
            echo '[FAIL] root_integration_run_id must be a positive integer' >&2
            exit 2
          }
          python3 -m tools.codex_assets.software_m5_rollover \
            --root . \
            --runtime-evidence "$RUNNER_TEMP/software-m5-runtime-smoke/runtime-smoke-evidence.json" \
            --root-integration-run-id "$ROOT_INTEGRATION_RUN_ID" \
            --apply \
            --summary-json \
            | tee "$RUNNER_TEMP/software-m5-runtime-smoke/rollover-summary.json"

          bash scripts/software-m5.sh certify --summary-json \
            | tee "$RUNNER_TEMP/software-m5-runtime-smoke/software-m5-certification.json"
          python3 -m tools.control_plane.status_projection \
            --root . \
            --require-fresh \
            --summary-json \
            | tee "$RUNNER_TEMP/software-m5-runtime-smoke/status-projection.json"

      - name: Assemble reviewable rollover bundle
        shell: bash
        run: |
          set -euo pipefail
          BUNDLE="$RUNNER_TEMP/software-m5-runtime-smoke/rollover-candidate"
          mkdir -p "$BUNDLE"
          python3 - "$RUNNER_TEMP/software-m5-runtime-smoke/rollover-summary.json" "$BUNDLE" <<'PY'
          import json
          import shutil
          import sys
          from pathlib import Path

          summary = json.loads(Path(sys.argv[1]).read_text(encoding='utf-8'))
          bundle = Path(sys.argv[2])
          for relative in summary['changed_paths']:
              src = Path(relative)
              dst = bundle / relative
              dst.parent.mkdir(parents=True, exist_ok=True)
              shutil.copyfile(src, dst)
          PY
          mapfile -t CHANGED_PATHS < <(python3 - "$RUNNER_TEMP/software-m5-runtime-smoke/rollover-summary.json" <<'PY'
          import json
          import sys
          from pathlib import Path

          for relative in json.loads(Path(sys.argv[1]).read_text(encoding='utf-8'))['changed_paths']:
              print(relative)
          PY
          )
          [[ "${#CHANGED_PATHS[@]}" -eq 5 ]] || {
            echo "[FAIL] rollover candidate must contain exactly five paths; got ${#CHANGED_PATHS[@]}" >&2
            exit 4
          }
          git add -N -- "${CHANGED_PATHS[@]}"
          git diff --binary > "$RUNNER_TEMP/software-m5-runtime-smoke/rollover.patch"
          git reset --mixed HEAD >/dev/null
          git status --short | tee "$RUNNER_TEMP/software-m5-runtime-smoke/rollover-status.txt"

      - name: Publish immutable runtime + rollover artifact
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v4
        with:
          name: software-m5-runtime-smoke-${{ github.sha }}
          path: ${{ runner.temp }}/software-m5-runtime-smoke
          if-no-files-found: error
          retention-days: 30

      - name: Record qualification handoff
        shell: bash
        run: |
          {
            echo '### Software M5 measured runtime + rollover candidate'
            echo "- root_sha: $GITHUB_SHA"
            echo "- artifact: software-m5-runtime-smoke-$GITHUB_SHA"
            echo '- model calls: exactly one measured Codex smoke task'
            echo '- remote writes: none'
            echo '- candidate: certifier PASS + fresh status projection PASS required before artifact publication'
            echo '- next: review/import rollover-candidate into a PR, run exact-head CI, merge, then verify fresh-main'
          } >> "$GITHUB_STEP_SUMMARY"
