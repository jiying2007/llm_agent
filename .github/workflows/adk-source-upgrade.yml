name: adk-source-upgrade

on:
  push:
    branches: [automation/adk-upgrade-1122]
    paths: [.github/workflows/adk-source-upgrade.yml]
  workflow_dispatch:
    inputs:
      version:
        description: Immutable ADK version, without v prefix
        required: true
      commit:
        description: Full released ADK commit SHA
        required: true
      ci_run_id:
        description: Trusted ADK main CI run containing signed evidence
        required: true

permissions:
  contents: write

concurrency:
  group: adk-upgrade-${{ github.ref }}
  cancel-in-progress: false

jobs:
  promote:
    if: github.repository == 'jiying2007/llm_agent'
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          submodules: true
          persist-credentials: true
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.12'
      - uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4.1.2
        with:
          cosign-release: v3.1.3
      - name: Validate immutable upstream release and stage atomic promotion
        env:
          GH_TOKEN: ${{ secrets.CODEX_SAFE_FAMILY_READ_TOKEN || github.token }}
          GITHUB_TOKEN: ${{ github.token }}
          ADK_VERSION: ${{ inputs.version || '11.2.2' }}
          ADK_COMMIT: ${{ inputs.commit || 'e7527342ea8704f967a4369aa5cf8c7a72e6c229' }}
          ADK_CI_RUN_ID: ${{ inputs.ci_run_id || '42775390580' }}
        shell: bash
        run: |
          set -euo pipefail
          test "${GITHUB_REF}" = "refs/heads/automation/adk-upgrade-1122" || {
            echo '[FAIL] Upgrade must run on its isolated, reviewed branch' >&2
            exit 1
          }
          [[ "$ADK_VERSION" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]
          [[ "$ADK_COMMIT" =~ ^[a-f0-9]{40}$ ]]
          [[ "$ADK_CI_RUN_ID" =~ ^[1-9][0-9]+$ ]]
          locked="$(git ls-files -s agent-dev-kit | awk '$1=="160000"{print $2}')"
          if [[ "$locked" == "$ADK_COMMIT" ]]; then
            echo "Already pinned ADK $ADK_VERSION at $ADK_COMMIT"
            exit 0
          fi
          # Fail closed if the base branch drifted. No force-push or protected-main write.
          git fetch origin main --no-tags
          test "$(git rev-parse origin/main)" = 562b8903b049984d447460553b2ecc4cceba1030
          python -m pip install . ./agent-dev-kit
          mkdir -p "$RUNNER_TEMP/adk-upstream"
          gh api "repos/jiying2007/agent-dev-kit/actions/runs/$ADK_CI_RUN_ID" > "$RUNNER_TEMP/adk-upstream/run.json"
          gh api "repos/jiying2007/agent-dev-kit/releases/tags/v$ADK_VERSION" > "$RUNNER_TEMP/adk-upstream/release.json"
          gh run download "$ADK_CI_RUN_ID" --repo jiying2007/agent-dev-kit \
            --name "adk-promotion-evidence-$ADK_COMMIT" \
            --dir "$RUNNER_TEMP/adk-upstream"
          python - "$RUNNER_TEMP/adk-upstream" "$ADK_COMMIT" "$ADK_VERSION" <<'PY'
          import json, sys
          from pathlib import Path
          root, commit, version = Path(sys.argv[1]), sys.argv[2], sys.argv[3]
          evidence = json.loads((root / "promotion-evidence.json").read_text())
          run = json.loads((root / "run.json").read_text())
          release = json.loads((root / "release.json").read_text())
          assert run["event"] == "push" and run["conclusion"] == "success"
          assert run["head_sha"] == commit
          assert evidence["source"]["commit"] == commit
          assert evidence["source"]["version"] == version
          assert evidence["source"]["run_id"] == run["id"]
          assert release["tag_name"] == "v" + version and not release["draft"] and not release["prerelease"]
          artifact = next(x for x in release["assets"] if x["name"] == "agent-dev-kit-" + version + ".tar.gz")
          assert artifact["digest"] == "sha256:" + evidence["release"]["artifact_sha256"]
          assert evidence["release"]["release_eligible"] is True
          PY
          cosign verify-blob \
            --bundle "$RUNNER_TEMP/adk-upstream/promotion-attestation.json" \
            --certificate-identity 'https://github.com/jiying2007/agent-dev-kit/.github/workflows/ci.yml@refs/heads/main' \
            --certificate-oidc-issuer 'https://token.actions.githubusercontent.com' \
            "$RUNNER_TEMP/adk-upstream/promotion-evidence.json"
          git -C agent-dev-kit fetch origin "refs/tags/v$ADK_VERSION:refs/tags/v$ADK_VERSION"
          test "$(git -C agent-dev-kit rev-parse "refs/tags/v$ADK_VERSION^{commit}")" = "$ADK_COMMIT"
          git -C agent-dev-kit checkout --detach "$ADK_COMMIT"
          python -m tools.control_plane.adk_promotion \
            --root . --candidate-dir agent-dev-kit --updated-at "$(date -u +%F)" \
            --promotion-evidence "$RUNNER_TEMP/adk-upstream/promotion-evidence.json" \
            --promotion-attestation "$RUNNER_TEMP/adk-upstream/promotion-attestation.json" \
            --apply --summary-json > "$RUNNER_TEMP/adk-upstream/root-receipt.json"
          bash scripts/check-adk-lock.sh . --pin-only
          git diff --cached --check
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git config user.name "github-actions[bot]"
          git commit -m "chore(promotion): pin signed ADK $ADK_VERSION source and immutable evidence"
          git push origin HEAD:refs/heads/automation/adk-upgrade-1122
