name: Prepare exact research closure
on:
  pull_request:
    types: [opened, reopened]
permissions:
  contents: read
jobs:
  prepare:
    if: >-
      github.actor == 'jiying2007' &&
      github.event.pull_request.head.repo.full_name == github.repository &&
      github.event.pull_request.head.ref == 'feat/research-effect-closure-7.1.0' &&
      github.event.pull_request.base.sha == '84b4d87a62ab808c32fcac85642998e3bbe29b99'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 0
          submodules: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: '3.11'
      - uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6
        with:
          cosign-release: v3.1.3
      - name: Verify fixed source, release and patch identities
        env:
          GH_TOKEN: ${{ github.token }}
          EXPECTED_HEAD: ${{ github.event.pull_request.head.sha }}
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$EXPECTED_HEAD"
          python - <<'PY'
          import base64,gzip,hashlib,json,subprocess,zipfile,io
          from pathlib import Path
          helpers={'.github/workflows/prepare-research-closure.yml','.github/research-closure-0.b64','.github/research-closure-1.b64','.github/research-consumer-cli.patch'}
          actual=set(subprocess.check_output(['git','diff','--name-only','84b4d87a62ab808c32fcac85642998e3bbe29b99','HEAD'],text=True).splitlines())
          assert actual==helpers,actual
          raw=b''.join(Path(f'.github/research-closure-{i}.b64').read_bytes() for i in range(2))
          assert len(raw)==8036
          patch=gzip.decompress(base64.b64decode(raw,validate=True))
          assert len(patch)==14215 and hashlib.sha256(patch).hexdigest()=='f6d803b679a0bd6e4397936f683963eee132d5525e7003e05a44aaadf14ae78e'
          fix=Path('.github/research-consumer-cli.patch').read_bytes()
          assert hashlib.sha256(fix).hexdigest()=='7debd61b0ae227bc15bd7d0b1cb76846eebef70d3a97f67a66e212a5fb4c9345'
          Path('/tmp/research-closure.patch').write_bytes(patch)
          repo='repos/jiying2007/agent-dev-kit';sha='70fac05125907e4930ee73f3928799e11bac55de'
          def api(path):return json.loads(subprocess.check_output(['gh','api',repo+'/'+path],timeout=30))
          run=api('actions/runs/36084512715')
          assert run['head_sha']==sha and run['event']=='push' and run['path']=='.github/workflows/ci.yml'
          assert run['status']=='completed' and run['conclusion']=='success'
          release=api('releases/tags/v7.1.0')
          assert release['immutable'] is True and not release['draft'] and not release['prerelease']
          blob=subprocess.check_output(['gh','api',repo+'/actions/artifacts/10843437656/zip'],timeout=30)
          assert hashlib.sha256(blob).hexdigest()=='87517b4d6b7eb161e4bb8fe07de14e2f50e5438396138d9ae4d1cba9068b2934'
          out=Path('/tmp/exact-promotion');out.mkdir()
          with zipfile.ZipFile(io.BytesIO(blob)) as archive:
              assert set(archive.namelist())=={'promotion-evidence.json','promotion-attestation.json','release-contract.json'}
              for item in archive.infolist():
                  assert item.file_size<100000
                  (out/item.filename).write_bytes(archive.read(item))
          evidence=json.loads((out/'promotion-evidence.json').read_text())
          assert evidence['source']['commit']==sha and evidence['source']['version']=='7.1.0'
          tar=[a for a in release['assets'] if a['name']=='agent-dev-kit-7.1.0.tar.gz']
          assert len(tar)==1 and tar[0]['digest']=='sha256:'+evidence['release']['artifact_sha256']
          PY
          cosign verify-blob --bundle /tmp/exact-promotion/promotion-attestation.json \
            --certificate-identity https://github.com/jiying2007/agent-dev-kit/.github/workflows/ci.yml@refs/heads/main \
            --certificate-oidc-issuer https://token.actions.githubusercontent.com \
            /tmp/exact-promotion/promotion-evidence.json
          git submodule update --init --depth=1 agent-dev-kit
          git -C agent-dev-kit fetch --depth=1 origin refs/tags/v7.1.0
          test "$(git -C agent-dev-kit rev-parse 'FETCH_HEAD^{commit}')" = 70fac05125907e4930ee73f3928799e11bac55de
          git -C agent-dev-kit checkout --detach 70fac05125907e4930ee73f3928799e11bac55de
      - name: Generate promotion and verify consumer changes without workflow mutation
        run: |
          set -euo pipefail
          python -m tools.control_plane.adk_promotion --root . --ref 70fac05125907e4930ee73f3928799e11bac55de \
            --updated-at 2026-09-25 --promotion-evidence /tmp/exact-promotion/promotion-evidence.json \
            --promotion-attestation /tmp/exact-promotion/promotion-attestation.json \
            --apply --receipt-out /tmp/promotion-receipt.json --summary-json
          git apply --exclude=.github/workflows/ci.yml --recount --check /tmp/research-closure.patch
          git apply --exclude=.github/workflows/ci.yml --recount --index /tmp/research-closure.patch
          git apply --check .github/research-consumer-cli.patch
          git apply --index .github/research-consumer-cli.patch
          python -m pip install . ./agent-dev-kit
          PYTHONDONTWRITEBYTECODE=1 bash tests/test_intake_active_docs.sh
          PYTHONDONTWRITEBYTECODE=1 bash tests/test_effect_trial_consumer.sh
          git diff --cached --check
      - name: Remove all temporary inputs and push guarded non-workflow transaction
        env:
          EXPECTED_HEAD: ${{ github.event.pull_request.head.sha }}
        run: |
          set -euo pipefail
          git rm .github/workflows/prepare-research-closure.yml .github/research-closure-{0,1}.b64 .github/research-consumer-cli.patch
          python - <<'PY'
          import subprocess
          expected={'agent-dev-kit','adk.lock','manifests/adk_interface.lock.json','reports/current-status.md',
            'reports/promotion/agent-dev-kit/promotion-evidence.json','reports/promotion/agent-dev-kit/promotion-attestation.json',
            'scripts/README.md','tests/test_intake_active_docs.sh','tests/test_effect_trial_consumer.sh',
            'docs/runbooks/practice-effect-review.md','docs/changes/2026-09-25-research-closure/requirements.md',
            'reports/optimization/2026-09-25/historical-script-status-2026-05-23.md',
            '.github/workflows/prepare-research-closure.yml','.github/research-closure-0.b64','.github/research-closure-1.b64','.github/research-consumer-cli.patch'}
          actual=set(subprocess.check_output(['git','diff','--cached','--name-only'],text=True).splitlines())
          assert actual==expected,(actual-expected,expected-actual)
          PY
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'feat(research): 集成重复试验并清理活动取证入口'
          test "$(git ls-remote origin refs/heads/feat/research-effect-closure-7.1.0 | cut -f1)" = "$EXPECTED_HEAD"
          git push origin HEAD:refs/heads/feat/research-effect-closure-7.1.0
          git archive --format=tar.gz HEAD > /tmp/root-source.tar.gz
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: research-closure-preparation
          path: |
            /tmp/promotion-receipt.json
            /tmp/root-source.tar.gz
          if-no-files-found: error
          retention-days: 7
