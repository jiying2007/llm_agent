name: native-governance-control-plane

on:
  workflow_dispatch:
  issue_comment:
    types: [created]

permissions:
  contents: read

concurrency:
  group: native-governance-control-plane-${{ github.run_id }}
  cancel-in-progress: false

jobs:
  verify:
    if: ${{ github.event_name == 'workflow_dispatch' || (github.event_name == 'issue_comment' && github.event.issue.number == 50 && github.event.comment.body == '/llm-agent-governance-verify' && github.event.comment.author_association == 'OWNER') }}
    name: native-governance
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Validate trusted main trigger
        shell: bash
        run: |
          set -euo pipefail
          if [[ "$GITHUB_REF" != "refs/heads/main" ]]; then
            echo "::error::native governance verification must run from main"
            exit 1
          fi

      - name: Checkout trusted main
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: main
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.11'

      - name: Evaluate hosted-authoritative native repository governance
        env:
          GH_TOKEN: ${{ github.token }}
        run: >-
          python -m tools.control_plane.cli native-governance
          --repo "$GITHUB_REPOSITORY"
          --branch main
          --scope hosted-ruleset
          --out "$RUNNER_TEMP/native-governance-report.json"
          --summary-json

      - name: Upload native governance evidence
        if: ${{ always() }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: llm-agent-native-governance-${{ github.sha }}
          path: ${{ runner.temp }}/native-governance-report.json
          if-no-files-found: error
          retention-days: 90
