name: Prepare exact ADK promotion
on:
  pull_request:
    types: [opened, reopened]
permissions:
  contents: read
jobs:
  prepare:
    if: >-
      github.actor == 'jiying2007' &&
      github.event.pull_request.head.repo.full_name == github.repository &&
      github.event.pull_request.head.ref == 'chore/promote-adk-7.0.32' &&
      github.event.pull_request.base.sha == '1b7b11a9bf303319130528b52e668a1a5bf6ed19'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 0
          submodules: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: '3.11'
      - uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6
        with:
          cosign-release: v3.1.3
      - name: Enforce isolated preparation and download exact evidence
        env:
          GH_TOKEN: ${{ github.token }}
          EXPECTED_HEAD: ${{ github.event.pull_request.head.sha }}
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$EXPECTED_HEAD"
          test "$(git diff --name-only 1b7b11a9bf303319130528b52e668a1a5bf6ed19 HEAD)" = '.github/workflows/prepare-exact-promotion.yml'
          gh api repos/jiying2007/agent-dev-kit/actions/artifacts/10839428056/zip > /tmp/promotion.zip
          printf '%s  %s\n' 4bf170e801eb9a2177baad05a1704b2e677d47e8d5347158f9b49c6b7427874c /tmp/promotion.zip | sha256sum --check -
          python - <<'PY'
          import zipfile
          from pathlib import Path
          with zipfile.ZipFile('/tmp/promotion.zip') as archive:
              assert set(archive.namelist()) == {'promotion-evidence.json','promotion-attestation.json','release-contract.json'}
              out = Path('/tmp/exact-promotion'); out.mkdir()
              for info in archive.infolist():
                  assert info.file_size < 100000
                  (out / info.filename).write_bytes(archive.read(info))
          PY
          cosign verify-blob --bundle /tmp/exact-promotion/promotion-attestation.json \
            --certificate-identity https://github.com/jiying2007/agent-dev-kit/.github/workflows/ci.yml@refs/heads/main \
            --certificate-oidc-issuer https://token.actions.githubusercontent.com \
            /tmp/exact-promotion/promotion-evidence.json
          git submodule update --init --depth=1 agent-dev-kit
          git -C agent-dev-kit fetch --depth=1 origin 399ca5ae89a7afb6a04efe0c53ee2c2f2890ce34
          git -C agent-dev-kit checkout --detach 399ca5ae89a7afb6a04efe0c53ee2c2f2890ce34
      - name: Generate through canonical promotion authority and push exact transaction
        env:
          EXPECTED_HEAD: ${{ github.event.pull_request.head.sha }}
        run: |
          set -euo pipefail
          python -m tools.control_plane.adk_promotion --root . --ref 399ca5ae89a7afb6a04efe0c53ee2c2f2890ce34 \
            --updated-at 2026-09-25 --promotion-evidence /tmp/exact-promotion/promotion-evidence.json \
            --promotion-attestation /tmp/exact-promotion/promotion-attestation.json \
            --apply --receipt-out /tmp/promotion-receipt.json --summary-json
          python - <<'PY'
          import subprocess
          expected = {'agent-dev-kit','adk.lock','manifests/adk_interface.lock.json','reports/current-status.md',
                      'reports/promotion/agent-dev-kit/promotion-evidence.json','reports/promotion/agent-dev-kit/promotion-attestation.json'}
          actual = set(subprocess.check_output(['git','diff','--cached','--name-only'],text=True).splitlines())
          assert actual == expected, actual
          PY
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'chore(adk): 集成已签名发布的 7.0.32'
          test "$(git ls-remote origin refs/heads/chore/promote-adk-7.0.32 | cut -f1)" = "$EXPECTED_HEAD"
          git push origin HEAD:refs/heads/chore/promote-adk-7.0.32
          git archive --format=tar.gz HEAD > /tmp/root-source.tar.gz
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: exact-promotion-preparation
          path: |
            /tmp/promotion-receipt.json
            /tmp/root-source.tar.gz
          if-no-files-found: error
          retention-days: 7
