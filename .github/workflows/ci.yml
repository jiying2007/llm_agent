name: llm-agent-ci

on:
  push:
    branches:
      - main
      - master
  pull_request:
  workflow_dispatch:
    inputs:
      require_adk_integration:
        description: Require portable ADK promotion evidence verification even when the diff would not normally require it
        required: false
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: llm-agent-ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  contract:
    name: contract
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout root source
        uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd # v5
        with:
          submodules: false
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: '3.11'

      - name: Run immutable source contracts
        run: >-
          python -m tools.control_plane.gate_runner
          --profile contract
          --output-json /tmp/llm-agent-contract-receipt.json

      - name: Validate portable ADK promotion evidence verifier
        run: bash tests/test_adk_promotion_evidence.sh

      - name: Upload contract receipt
        if: ${{ always() }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v4
        with:
          name: llm-agent-contract-receipt
          path: /tmp/llm-agent-contract-receipt.json
          if-no-files-found: error
          retention-days: 14

  doc-sync:
    name: doc-sync
    needs: contract
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout root source
        uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd # v5
        with:
          submodules: false
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: '3.11'

      - name: Install document gate dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y ripgrep

      - name: Run document synchronization gate
        run: >-
          python -m tools.control_plane.gate_runner
          --profile doc-sync
          --output-json /tmp/llm-agent-doc-sync-receipt.json

      - name: Upload doc-sync receipt
        if: ${{ always() }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v4
        with:
          name: llm-agent-doc-sync-receipt
          path: /tmp/llm-agent-doc-sync-receipt.json
          if-no-files-found: error
          retention-days: 14

  integration-impact:
    name: integration-impact
    needs:
      - contract
      - doc-sync
    runs-on: ubuntu-24.04
    outputs:
      required: ${{ steps.impact.outputs.required }}
      reason: ${{ steps.impact.outputs.reason }}
    steps:
      - name: Checkout root source with comparison history
        uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd # v5
        with:
          submodules: false
          persist-credentials: false
          fetch-depth: 0

      - name: Classify whether ADK promotion evidence verification is required
        id: impact
        shell: bash
        env:
          EVENT_NAME: ${{ github.event_name }}
          PR_BASE_SHA: ${{ github.event.pull_request.base.sha }}
          PUSH_BEFORE_SHA: ${{ github.event.before }}
          FORCE_REQUIRED: ${{ github.event_name == 'workflow_dispatch' && inputs.require_adk_integration || false }}
        run: |
          set -euo pipefail
          required=false
          reason=not-required
          if [[ "$FORCE_REQUIRED" == "true" ]]; then
            required=true
            reason=workflow-dispatch
          else
            base=""
            mode="two-dot"
            if [[ "$EVENT_NAME" == "pull_request" ]]; then
              base="$PR_BASE_SHA"
              mode="three-dot"
            elif [[ "$EVENT_NAME" == "push" ]]; then
              base="$PUSH_BEFORE_SHA"
            fi
            if [[ -n "$base" && ! "$base" =~ ^0+$ ]] && git cat-file -e "${base}^{commit}" 2>/dev/null; then
              if [[ "$mode" == "three-dot" ]]; then
                changed="$(git diff --name-only "$base"...HEAD)"
              else
                changed="$(git diff --name-only "$base"..HEAD)"
              fi
              printf '%s\n' "$changed" > /tmp/llm-agent-changed-paths.txt
              if grep -Eq '^(adk\.lock|agent-dev-kit|manifests/(adk_interface\.lock|runtime_targets|runtime_health_adapters|product_maturity_scorecard|software_m5_policy)\.json|reports/promotion/agent-dev-kit/(promotion-evidence|promotion-attestation)\.json)$' /tmp/llm-agent-changed-paths.txt; then
                required=true
                reason=cross-repo-contract-change
              fi
            fi
          fi
          echo "required=$required" >> "$GITHUB_OUTPUT"
          echo "reason=$reason" >> "$GITHUB_OUTPUT"
          {
            echo "### ADK promotion evidence impact"
            echo "- required: $required"
            echo "- reason: $reason"
          } >> "$GITHUB_STEP_SUMMARY"

  integration:
    name: integration-deep
    needs:
      - contract
      - doc-sync
      - integration-impact
    if: ${{ needs.integration-impact.outputs.required == 'true' }}
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout root source
        uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd # v5
        with:
          submodules: false
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: '3.11'

      - name: Install Cosign
        uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4.1.2
        with:
          cosign-release: v3.1.3

      - name: Verify portable promotion evidence claims
        run: >-
          python -m tools.control_plane.adk_promotion_evidence
          --evidence reports/promotion/agent-dev-kit/promotion-evidence.json
          --lock adk.lock
          --interface manifests/adk_interface.lock.json
          --summary-json
          > /tmp/llm-agent-integration-receipt.json

      - name: Initialize Sigstore trusted root
        id: sigstore_root
        shell: bash
        run: |
          set -euo pipefail
          cosign initialize
          trusted_root="$(find "$HOME/.sigstore/root" -type f -path '*/targets/trusted_root.json' -print -quit)"
          [[ -n "$trusted_root" && -f "$trusted_root" ]] || { echo '[FAIL] Sigstore trusted_root.json was not initialized' >&2; exit 1; }
          echo "path=$trusted_root" >> "$GITHUB_OUTPUT"

      - name: Verify keyless ADK Sigstore bundle with Rekor v2 trust time
        run: >-
          cosign verify-blob
          --use-signed-timestamps
          --trusted-root '${{ steps.sigstore_root.outputs.path }}'
          --bundle reports/promotion/agent-dev-kit/promotion-attestation.json
          --certificate-identity https://github.com/jiying2007/agent-dev-kit/.github/workflows/ci.yml@refs/heads/main
          --certificate-oidc-issuer https://token.actions.githubusercontent.com
          reports/promotion/agent-dev-kit/promotion-evidence.json
          > /tmp/adk-attestation-verification.txt

      - name: Re-run root-side exact interface contracts
        run: |
          bash scripts/check-adk-lock.sh . --pin-only
          bash tests/test_adk_interface_lock.sh

      - name: Upload integration evidence
        if: ${{ always() }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v4
        with:
          name: llm-agent-integration-evidence
          path: |
            /tmp/llm-agent-integration-receipt.json
            /tmp/adk-attestation-verification.txt
          if-no-files-found: warn
          retention-days: 14

  integration-summary:
    name: integration-summary
    if: ${{ always() }}
    needs:
      - integration-impact
      - integration
    runs-on: ubuntu-24.04
    steps:
      - name: Enforce explicit PASS / NOT_REQUIRED / BLOCKED semantics
        shell: bash
        env:
          IMPACT_RESULT: ${{ needs.integration-impact.result }}
          INTEGRATION_RESULT: ${{ needs.integration.result }}
          REQUIRED: ${{ needs.integration-impact.outputs.required }}
          REASON: ${{ needs.integration-impact.outputs.reason }}
        run: |
          set -euo pipefail
          if [[ "$IMPACT_RESULT" != "success" ]]; then
            echo "[FAIL] integration impact classification did not succeed: $IMPACT_RESULT" >&2
            exit 1
          fi
          if [[ "$REQUIRED" == "true" ]]; then
            if [[ "$INTEGRATION_RESULT" != "success" ]]; then
              echo "[FAIL] promotion evidence verification was REQUIRED but did not pass (integration=$INTEGRATION_RESULT)" >&2
              exit 1
            fi
            echo "### ADK promotion evidence: PASS ($REASON)" >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi
          if [[ "$INTEGRATION_RESULT" == "failure" || "$INTEGRATION_RESULT" == "cancelled" ]]; then
            echo "[FAIL] optional promotion evidence verification ran but did not pass: $INTEGRATION_RESULT" >&2
            exit 1
          fi
          echo '### ADK promotion evidence: NOT_REQUIRED' >> "$GITHUB_STEP_SUMMARY"
