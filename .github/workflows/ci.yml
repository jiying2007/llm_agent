name: llm-agent-ci

on:
  push:
    branches:
      - main
      - master
  pull_request:
  workflow_dispatch:
    inputs:
      require_adk_integration:
        description: Require portable ADK promotion evidence verification even when the gate graph would not normally require it
        required: false
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: llm-agent-ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  contract:
    name: contract
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout root source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          submodules: false
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.11'

      - name: Install declared control-plane dependencies
        run: python -m pip install .

      - name: Verify bounded cache-only intake
        run: bash tests/test_intake_hardening.sh

      - name: Validate pinned workflow action runtime compatibility
        run: bash tests/test_workflow_action_compatibility.sh

      - name: Validate terminal consumer pin chain
        run: bash tests/test_consumer_chain.sh

      - name: Run immutable source contracts through typed control plane
        run: >-
          python -m tools.control_plane.cli gate
          --profile contract
          --output-json /tmp/llm-agent-contract-receipt.json

      - name: Validate portable ADK promotion evidence verifier
        run: bash tests/test_adk_promotion_evidence.sh

      - name: Validate Software M5 qualification tooling
        run: |
          bash -n tests/test_runtime_smoke_evidence.sh
          bash -n tests/test_software_m5_rollover.sh
          bash tests/test_runtime_smoke_evidence.sh
          bash tests/test_software_m5_rollover.sh

      - name: Upload contract receipt
        if: ${{ always() }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: llm-agent-contract-receipt
          path: /tmp/llm-agent-contract-receipt.json
          if-no-files-found: error
          retention-days: 14

  doc-sync:
    name: doc-sync
    needs: contract
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout root source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          submodules: false
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.11'

      - name: Install document gate dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y ripgrep

      - name: Run document synchronization gate through typed control plane
        run: >-
          python -m tools.control_plane.cli gate
          --profile doc-sync
          --output-json /tmp/llm-agent-doc-sync-receipt.json

      - name: Upload doc-sync receipt
        if: ${{ always() }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: llm-agent-doc-sync-receipt
          path: /tmp/llm-agent-doc-sync-receipt.json
          if-no-files-found: error
          retention-days: 14

  integration-impact:
    name: integration-impact
    needs:
      - contract
      - doc-sync
    runs-on: ubuntu-24.04
    outputs:
      required: ${{ steps.impact.outputs.required }}
      reason: ${{ steps.impact.outputs.reason }}
    steps:
      - name: Checkout root source with comparison history
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          submodules: false
          persist-credentials: false
          fetch-depth: 0

      - name: Calculate integration impact from gate dependency graph
        id: impact
        shell: bash
        env:
          EVENT_NAME: ${{ github.event_name }}
          PR_BASE_SHA: ${{ github.event.pull_request.base.sha }}
          PUSH_BEFORE_SHA: ${{ github.event.before }}
          FORCE_REQUIRED: ${{ github.event_name == 'workflow_dispatch' && inputs.require_adk_integration || false }}
        run: |
          set -euo pipefail
          base=""
          mode="two-dot"
          if [[ "$EVENT_NAME" == "pull_request" ]]; then
            base="$PR_BASE_SHA"
            mode="three-dot"
          elif [[ "$EVENT_NAME" == "push" ]]; then
            base="$PUSH_BEFORE_SHA"
          fi

          args=(
            python -m tools.control_plane.cli impact
            --root .
            --group integration-deep
            --head HEAD
            --mode "$mode"
            --github-output "$GITHUB_OUTPUT"
            --step-summary "$GITHUB_STEP_SUMMARY"
          )
          if [[ "$FORCE_REQUIRED" == "true" ]]; then
            args+=(--force)
          fi
          if [[ -n "$base" && ! "$base" =~ ^0+$ ]] && git cat-file -e "${base}^{commit}" 2>/dev/null; then
            args+=(--base "$base")
          fi
          "${args[@]}"

  integration:
    name: integration-deep
    needs:
      - contract
      - doc-sync
      - integration-impact
    if: ${{ needs.integration-impact.outputs.required == 'true' }}
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout root source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          submodules: false
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.11'

      - name: Install Cosign
        uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4.1.2
        with:
          cosign-release: v3.1.3

      - name: Install root regression dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y ripgrep
          python -m pip install .

      - name: Initialize pinned ADK source
        run: git submodule update --init --depth=1 agent-dev-kit

      - name: Install pinned ADK for source-layer consumer regression
        run: python -m pip install ./agent-dev-kit

      - name: Verify portable promotion evidence claims
        run: >-
          python -m tools.control_plane.cli promotion-evidence
          --evidence reports/promotion/agent-dev-kit/promotion-evidence.json
          --lock adk.lock
          --interface manifests/adk_interface.lock.json
          --summary-json
          > /tmp/llm-agent-integration-receipt.json

      - name: Verify keyless ADK Sigstore bundle with bounded trust refresh retries
        run: |
          set -euo pipefail
          for attempt in 1 2 3; do
            echo "[INFO] Sigstore verification attempt ${attempt}/3"
            if cosign initialize && cosign verify-blob \
              --bundle reports/promotion/agent-dev-kit/promotion-attestation.json \
              --certificate-identity https://github.com/jiying2007/agent-dev-kit/.github/workflows/ci.yml@refs/heads/main \
              --certificate-oidc-issuer https://token.actions.githubusercontent.com \
              reports/promotion/agent-dev-kit/promotion-evidence.json \
              > /tmp/adk-attestation-verification.txt; then
              exit 0
            fi
            if [[ "${attempt}" -eq 3 ]]; then
              echo "[FAIL] Sigstore bundle verification failed after 3 strict attempts" >&2
              exit 1
            fi
            sleep "$((attempt * 2))"
          done

      - name: Re-run root-side exact interface contracts
        run: |
          bash scripts/check-adk-lock.sh . --pin-only
          bash scripts/check-codex-lock.sh . --pin-only
          python -m tools.control_plane.adk_interface --root . --require-worktree --summary-json > /tmp/adk-interface-worktree.json
          bash tests/test_adk_interface_lock.sh

      - name: Verify terminal ADK to Codex runtime chain
        run: |
          set -euo pipefail
          git submodule update --init --depth=1 codex
          bash scripts/check-codex-lock.sh .
          python -m tools.control_plane.cli runtime-chain --root . --require-codex-worktree --summary-json > /tmp/runtime-chain-receipt.json

      - name: Run declarative integration-extra gate graph
        run: >-
          python -m tools.control_plane.cli gate
          --profile integration-extra
          --output-json /tmp/llm-agent-integration-gate-receipt.json

      - name: Verify terminal digital-worker consumer evidence binding
        run: >-
          python -m tools.control_plane.cli consumer-chain
          --root .
          --require-codex-worktree
          --summary-json
          > /tmp/consumer-chain-receipt.json

      - name: Upload integration evidence
        if: ${{ always() }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: llm-agent-integration-evidence
          path: |
            /tmp/llm-agent-integration-receipt.json
            /tmp/adk-attestation-verification.txt
            /tmp/adk-interface-worktree.json
            /tmp/runtime-chain-receipt.json
            /tmp/llm-agent-integration-gate-receipt.json
            /tmp/consumer-chain-receipt.json
          if-no-files-found: warn
          retention-days: 14

  integration-summary:
    name: integration-summary
    if: ${{ always() }}
    needs:
      - integration-impact
      - integration
    runs-on: ubuntu-24.04
    steps:
      - name: Enforce explicit PASS / NOT_REQUIRED / BLOCKED semantics
        shell: bash
        env:
          IMPACT_RESULT: ${{ needs.integration-impact.result }}
          INTEGRATION_RESULT: ${{ needs.integration.result }}
          REQUIRED: ${{ needs.integration-impact.outputs.required }}
          REASON: ${{ needs.integration-impact.outputs.reason }}
        run: |
          set -euo pipefail
          if [[ "$IMPACT_RESULT" != "success" ]]; then
            echo "[FAIL] integration impact classification did not succeed: $IMPACT_RESULT" >&2
            exit 1
          fi
          if [[ "$REQUIRED" == "true" ]]; then
            if [[ "$INTEGRATION_RESULT" != "success" ]]; then
              echo "[FAIL] promotion evidence verification was REQUIRED but did not pass (integration=$INTEGRATION_RESULT)" >&2
              exit 1
            fi
            echo "### ADK promotion evidence: PASS ($REASON)" >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi
          if [[ "$INTEGRATION_RESULT" == "failure" || "$INTEGRATION_RESULT" == "cancelled" ]]; then
            echo "[FAIL] optional promotion evidence verification ran but did not pass: $INTEGRATION_RESULT" >&2
            exit 1
          fi
          echo '### ADK promotion evidence: NOT_REQUIRED' >> "$GITHUB_STEP_SUMMARY"

  software-m5:
    name: software-m5-certify
    if: ${{ always() && needs.contract.result == 'success' && needs.doc-sync.result == 'success' && needs.integration-summary.result == 'success' }}
    needs:
      - contract
      - doc-sync
      - integration-summary
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout root source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          submodules: false
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.11'

      - name: Enforce Software M5 current-or-historical qualification state
        shell: bash
        run: |
          set -euo pipefail
          python3 -m tools.control_plane.cli status --root . --summary-json > /tmp/software-m5-projection.json
          mode="$(
            python3 - <<'PYMODE'
          import json
          import re
          from pathlib import Path

          projection = json.loads(Path('/tmp/software-m5-projection.json').read_text(encoding='utf-8'))
          assert projection['status'] == 'pass', projection
          assert projection['source']['pin_consistent'] is True, projection
          assert projection['current_projection']['consistent'] is True, projection
          if projection['release_authorized'] is True:
              print('CERTIFIED')
          else:
              assert projection['current_evidence_state'] == 'source-current-evidence-historical', projection
              baseline = projection['last_verified_baseline']
              assert baseline['fresh_for_current_source'] is False, projection
              assert baseline['source_inputs_match'] is False, projection
              status = Path('reports/current-status.md').read_text(encoding='utf-8')
              begin = '<!-- BEGIN GENERATED CURRENT SOURCE PROJECTION -->'
              end = '<!-- END GENERATED CURRENT SOURCE PROJECTION -->'
              assert status.count(begin) == 1 and status.count(end) == 1, status
              block = status.split(begin, 1)[1].split(end, 1)[0]
              assert re.search(r'^- release_evidence_relation:\s*historical$', block, re.MULTILINE), block
              assert re.search(r'^- release_authorized:\s*false$', block, re.MULTILINE), block
              print('HISTORICAL_NOT_AUTHORIZED')
          PYMODE
          )"
          if [[ "$mode" == "CERTIFIED" ]]; then
            bash scripts/software-m5.sh certify --summary-json | tee /tmp/software-m5-certification.json
            echo '### Software M5: CERTIFIED' >> "$GITHUB_STEP_SUMMARY"
          elif [[ "$mode" == "HISTORICAL_NOT_AUTHORIZED" ]]; then
            python3 - <<'PYRECEIPT' > /tmp/software-m5-certification.json
          import json
          from pathlib import Path

          projection = json.loads(Path('/tmp/software-m5-projection.json').read_text(encoding='utf-8'))
          receipt = {
              'schema': 'llm-agent-software-m5-ci-state/v1',
              'status': 'pass',
              'qualification_state': 'HISTORICAL_NOT_AUTHORIZED',
              'release_authorized': False,
              'current_evidence_state': projection['current_evidence_state'],
              'current_adk_commit': projection['source']['adk_lock_commit'],
              'projection_inputs_sha256': projection['current_projection']['inputs_sha256'],
              'last_verified_baseline': projection['last_verified_baseline'],
          }
          print(json.dumps(receipt, ensure_ascii=False, sort_keys=True))
          PYRECEIPT
            cat /tmp/software-m5-certification.json
            echo '### Software M5: HISTORICAL_NOT_AUTHORIZED' >> "$GITHUB_STEP_SUMMARY"
          else
            echo "[FAIL] unexpected Software M5 qualification mode: $mode" >&2
            exit 1
          fi

      - name: Upload Software M5 certification receipt
        if: ${{ always() }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: software-m5-certification
          path: /tmp/software-m5-certification.json
          if-no-files-found: error
          retention-days: 30
