name: llm-agent-ci

on:
  push:
    branches:
      - main
      - master
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  product-gate:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout root source
        uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd # v5
        with:
          submodules: false

      - name: Initialize only the locked ADK submodule
        run: |
          git submodule sync -- agent-dev-kit
          git submodule update --init agent-dev-kit

      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: '3.11'

      - name: Install gate dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y ripgrep shellcheck
          python -m pip install ./agent-dev-kit

      - name: Validate entry points
        run: |
          bash -n scripts/*.sh
          shellcheck -S error -x -P scripts scripts/*.sh tests/*.sh
          python -m py_compile tools/codex_assets/*.py

      - name: Validate clean-clone ADK integration
        run: |
          bash scripts/check-adk-lock.sh .
          bash agent-dev-kit/scripts/devkit.sh validate --strict
          bash agent-dev-kit/tests/run_all.sh --quick

      - name: Run root regression suite
        run: bash tests/run_all.sh --fail-fast --timing-json /tmp/llm-agent-root-tests.json

      - name: Run self-contained documentation gate
        run: bash scripts/check-doc-sync.sh .
