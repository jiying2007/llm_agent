name: Runtime Smoke Collector Selftest

on:
  push:
    branches:
      - codex/runtime-smoke-collector

permissions:
  contents: read

jobs:
  selftest:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd # v5
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: '3.11'
      - name: Compile collector
        run: python3 -m py_compile tools/codex_assets/runtime_smoke_evidence.py
      - name: Run collector regression
        run: bash tests/test_runtime_smoke_evidence.sh
