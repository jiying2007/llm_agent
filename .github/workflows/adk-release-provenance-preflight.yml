name: adk-release-provenance-preflight

on:
  push:
    branches: [refactor/adk-ephemeral-provenance-20261110]
    paths: [.github/workflows/adk-release-provenance-preflight.yml]

permissions:
  contents: read

jobs:
  verify:
    if: github.repository == 'jiying2007/llm_agent'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    env:
      GH_TOKEN: ${{ secrets.CODEX_SAFE_FAMILY_READ_TOKEN || github.token }}
    steps:
      - name: Verify immutable release digest and native attestation
        shell: bash
        run: |
          set -euo pipefail
          repo="jiying2007/agent-dev-kit"
          version="11.2.2"
          commit="e7527342ea8704f967a4369aa5cf8c7a72e6c229"
          mkdir -p "$RUNNER_TEMP/adk-release"
          gh release download "v$version" -R "$repo" \
            --pattern "agent-dev-kit-$version.tar.gz" \
            --pattern "agent-dev-kit-$version.tar.gz.sha256" \
            --pattern release-contract.json \
            --dir "$RUNNER_TEMP/adk-release"
          (cd "$RUNNER_TEMP/adk-release" && sha256sum --check "agent-dev-kit-$version.tar.gz.sha256")
          gh api -H "X-GitHub-Api-Version: 2026-03-10" "repos/$repo/releases/tags/v$version" \
            > "$RUNNER_TEMP/adk-release/api.json"
          python3 - "$RUNNER_TEMP/adk-release" "$version" "$commit" <<'PY'
          import hashlib, json, sys
          from pathlib import Path
          directory,version,commit=Path(sys.argv[1]),sys.argv[2],sys.argv[3]
          release=json.loads((directory/'api.json').read_text())
          assert release['immutable'] is True
          archive=directory/('agent-dev-kit-'+version+'.tar.gz')
          digest=hashlib.sha256(archive.read_bytes()).hexdigest()
          assert next(a for a in release['assets'] if a['name']==archive.name)['digest']=='sha256:'+digest
          contract=json.loads((directory/'release-contract.json').read_text())
          print('RELEASE_CONTRACT',json.dumps(contract,sort_keys=True)[:1200])
          print('ASSET_IDENTITY',version,commit,digest)
          PY
          gh attestation verify "$RUNNER_TEMP/adk-release/agent-dev-kit-$version.tar.gz" \
            --repo "$repo" \
            --signer-workflow "$repo/.github/workflows/release.yml" \
            --source-digest "$commit" \
            --format json > "$RUNNER_TEMP/adk-release/attestation-result.json"
          python3 - "$RUNNER_TEMP/adk-release/attestation-result.json" <<'PY'
          import json,sys
          result=json.load(open(sys.argv[1]))
          print('ATTESTATION_SUCCESS',len(result))
          for item in result[:1]:
              print('ATTESTATION_FIELDS',sorted(item))
              print('SOURCE_PROVENANCE',json.dumps(item.get('verificationResult',{}).get('statement',{}).get('predicate',{}))[:750])
          PY
