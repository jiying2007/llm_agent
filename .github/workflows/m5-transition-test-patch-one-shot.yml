name: Patch M5 Transition CI Contract

on:
  push:
    branches:
      - codex/software-m5-transition-aware

permissions:
  contents: write

jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd # v5
        with:
          ref: codex/software-m5-transition-aware
          fetch-depth: 0
          persist-credentials: true
      - name: Add fail-closed transition assertions
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          path = Path('tests/test_ci_incremental_gate_dag.sh')
          text = path.read_text(encoding='utf-8')
          marker = 'assert "bash scripts/software-m5.sh certify --summary-json" in github, github\n'
          additions = (
              'assert "Enforce Software M5 current-or-historical qualification state" in github, github\n'
              'assert "HISTORICAL_NOT_AUTHORIZED" in github, github\n'
              'assert "source-current-evidence-historical" in github, github\n'
              'assert "fresh_for_current_source\'] is False" in github, github\n'
              'assert "source_inputs_match\'] is False" in github, github\n'
              'assert "release_evidence_relation:\\\\s*historical" in github, github\n'
              'assert "release_authorized:\\\\s*false" in github, github\n'
          )
          if additions.splitlines()[0] in text:
              raise SystemExit('transition assertions already present')
          if marker not in text:
              raise SystemExit('certification marker missing')
          path.write_text(text.replace(marker, marker + additions, 1), encoding='utf-8')
          PY
          git diff --check
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add tests/test_ci_incremental_gate_dag.sh
          git commit -m 'test(ci): lock fail-closed M5 transition semantics'
          git push origin HEAD:codex/software-m5-transition-aware
