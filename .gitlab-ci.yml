stages:
  - validate
  - test
  - report

variables:
  GIT_SUBMODULE_STRATEGY: recursive

default:
  image: ubuntu:24.04
  before_script:
    - apt-get update
    - DEBIAN_FRONTEND=noninteractive apt-get install -y bash git python3 python3-yaml ripgrep

validate-scripts:
  stage: validate
  script:
    - bash -n scripts/*.sh
    - python3 -m py_compile tools/codex_assets/*.py

validate-registry:
  stage: validate
  script:
    - bash scripts/check-subrepo-state.sh .
    - bash scripts/check-adoption-matrix-status.sh .

validate-product-contracts:
  stage: validate
  script:
    - bash tests/test_product_maturity_contracts.sh
    - bash tests/test_reference_source_integrity.sh

check-coverage:
  stage: test
  script:
    - bash scripts/check-agents-coverage.sh .

check-docs:
  stage: test
  script:
    - bash scripts/check-doc-sync.sh .

full-check:
  stage: test
  script:
    - bash scripts/check-all.sh --quick

weekly-report:
  stage: report
  script:
    - bash scripts/generate-weekly-report.sh
  artifacts:
    paths:
      - reports/weekly-report-*.md
    expire_in: 30 days
  rules:
    - if: '$CI_PIPELINE_SOURCE == "schedule"'
