stages:
  - contract
  - test
  - report

variables:
  # Reference gitlinks are immutable observation inputs; CI must never recursively
  # traverse every reference repository as part of the product gate.
  GIT_SUBMODULE_STRATEGY: none

default:
  image: ubuntu:24.04
  before_script:
    - apt-get update
    - DEBIAN_FRONTEND=noninteractive apt-get install -y bash git python3 python3-yaml ripgrep

contract:
  stage: contract
  script:
    - python3 -m tools.control_plane.gate_runner --profile contract

doc-sync:
  stage: test
  needs:
    - contract
  script:
    - python3 -m tools.control_plane.gate_runner --profile doc-sync

weekly-report:
  stage: report
  needs:
    - doc-sync
  script:
    - bash scripts/generate-weekly-report.sh
  artifacts:
    paths:
      - reports/weekly-report-*.md
    expire_in: 30 days
  rules:
    - if: '$CI_PIPELINE_SOURCE == "schedule"'
